# Safe v0.1 deployment: local-only API, no privileged access, no simulated orders.
services:
  engine:
    build: .
    image: ai-investment-engine:0.1
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8018:8018"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8018/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
