# Local-only API. Market data persists in ./data; no OTW write access is implemented.
services:
  engine:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: ai-investment-engine:0.6
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENGINE_DATA_DIR: /data
    ports:
      - "127.0.0.1:8018:8018"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8018/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
