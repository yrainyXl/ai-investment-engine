[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-engine"
version = "0.4.0"
description = "Evidence-first read-only AI paper investment research and backtesting engine for OTW"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.25,<1"]
market-data = ["akshare>=1.17"]
fundamentals = ["pypdf>=5,<7"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
investment-engine = "investment_engine.cli:main"
investment-engine-market = "investment_engine.market_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["investment_engine*"]
