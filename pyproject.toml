[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-engine"
version = "0.1.0"
description = "Read-only, evidence-first AI paper investment decision pipeline for OTW"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.25,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
investment-engine = "investment_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["investment_engine*"]
